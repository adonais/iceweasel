<!doctype html>
<html>
  <head>
    <meta charset=utf-8>
    <meta name="timeout" content="long">
    <title>Encrypted Media Extensions: Successful Playback, Temporary session with DRM, Opus in mp4</title>
    <link rel="help" href="https://w3c.github.io/encrypted-media/">

    <script src=/resources/testharness.js></script>
    <script src=/resources/testharnessreport.js></script>

    <script src=/encrypted-media/util/utils.js></script>
    <script src=/encrypted-media/util/utf8.js></script>
    <script src=/encrypted-media/content/content-metadata.js></script>
    <script src=resources/content-metadata.js></script>
    <script src=/encrypted-media/util/drm-messagehandler.js></script>

    <script src=resources/audio-playback-temporary.js></script>
  </head>
  <body>
    <div id='log'></div>
    <audio id="audioelement"></audio>

    <script type="module">
      const keysystem = await getSupportedKeySystem(),
        contentitem = content["mp4-opus"],
        handler = new MessageHandler(keysystem, contentitem);
      runTest({
        audio: document.getElementById("audioelement"),
        keysystem,
        messagehandler: handler.messagehandler,
        contentitem,
        duration: 1,
      });
    </script>
  </body>
</html>
