[RTCRtpSender-replaceTrack.https.html]
  bug: https://bugzilla.mozilla.org/show_bug.cgi?id=1526207
  prefs:
    # Hardware video decoders on Android produce SurfaceTextureImage frames
    # that cannot be read back via canvas drawImage once the compositor has
    # attached to the SurfaceTexture GL context. Use software decoders so
    # GetAsSourceSurface() works. Bug 1526207
    if os == "android": [media.navigator.mediadatadecoder_h264_enabled:false, media.navigator.mediadatadecoder_vpx_enabled:false]
