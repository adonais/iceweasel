schema: 1

bugzilla:
  product: Core
  component: "Graphics: Text"

origin:
  name: freetype2
  description: Freely available software library to render fonts.

  url: https://gitlab.freedesktop.org/freetype/freetype

  release: d5d4bef0c6d5363931d346a6b2380317a32b8601 (2026-10-06T10:11:29.000-04:00).
  revision: d5d4bef0c6d5363931d346a6b2380317a32b8601

