schema: 1

bugzilla:
  product: Core
  component: "Graphics: Text"

origin:
  name: freetype2
  description: Freely available software library to render fonts.

  url: https://gitlab.freedesktop.org/freetype/freetype

  release: 0eca44e6e819f9e156eee0de2cbbcffd3a59e47b (2026-10-19T06:12:33.000+02:00).
  revision: 0eca44e6e819f9e156eee0de2cbbcffd3a59e47b

  license: FTL
  license-file: docs/FTL.TXT

updatebot:
  maintainer-phab: jfkthame
  maintainer-bz: jfkthame@gmail.com
  try-preset: freetype
  tasks:
    - type: vendoring
      enabled: true
      frequency: 1 week

vendoring:
  url: https://gitlab.freedesktop.org/freetype/freetype
  source-hosting: gitlab
  tracking: commit

  exclude:
    - ".**"
    - autogen.sh
    - builds
    - CMakeLists.txt
    - configure
    - devel
    - docs
    - Makefile
    - meson.build
    - meson_options.txt
    - mkfile
    - MSBuild.rsp
    - MSBuild.sln
    - objs
    - subprojects
    - tests
    - vms_make.com

  include:
    - docs/FTL.TXT

  keep:
    - moz.build
