<!DOCTYPE html>
<!-- Bug 1997056: two 50% slices of a dimension that is an odd number of app
     units must not leave a middle band, so no left/right (or top/bottom)
     edge segments may be drawn. -->
<style>
div {
  display: inline-block;
  vertical-align: top;
  margin: 10px;
  border-image: linear-gradient(cyan, orange) 50% 49% / 30px;
}
#v { width: 100px; height: 100.05px; }
#h { width: 100.05px; height: 100px; border-image-slice: 49% 50%; }
</style>
<div id="v"></div>
<div id="h"></div>
