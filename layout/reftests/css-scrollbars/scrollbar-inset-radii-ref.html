<!DOCTYPE HTML>
<title>No scrollbar, so the radius is never reduced</title>
<style>

.contain { position: relative; height: 140px }

.test {
  position: absolute;
  top: 0;
  left: 0;
  width: 200px;
  height: 100px;
  border: 10px solid blue;
  border-radius: 20px;
  overflow: hidden;
}

/* Covers the whole padding box, so only the border ring is compared and the
   scrollbar itself can't contribute pixels. */
.cover {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 200px;
  height: 100px;
  background: blue;
}

</style>

<div class="contain">
  <div class="test"></div>
  <div class="cover"></div>
</div>
