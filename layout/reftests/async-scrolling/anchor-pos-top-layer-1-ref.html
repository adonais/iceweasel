<!DOCTYPE html>
<html>
<style>
.anchor {
  position: absolute;
  left: 0;
  top: 50px;
  width: 50px;
  height: 50px;
  background: blue;
}
.anchored {
  position: absolute;
  left: 50px;
  top: 50px;
  width: 50px;
  height: 50px;
  background: yellow;
}
.child {
  position: absolute;
  left: 50px;
  top: 50px;
  width: 10px;
  height: 10px;
  background: green;
}
</style>
<div class="anchor"></div>
<div class="anchored"></div>
<div class="child"></div>
</html>
