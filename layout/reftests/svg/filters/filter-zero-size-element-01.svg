<svg xmlns="http://www.w3.org/2000/svg">
  <title>Testcase for a filter on an element with invalid dimensions</title>

  <!-- The rect has a zero width and height, so the SVG spec says not to render
       it at all, filter included, even though feFlood does not read its input.
       The transform is what keeps the filter off the blob fallback, which would
       hide the filter output for an unrelated reason. -->
  <filter id="flood" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
    <feFlood flood-color="red"/>
  </filter>

  <rect width="100%" height="100%" fill="lime"/>
  <rect x="10" y="10" width="0" height="0" fill="red" filter="url(#flood)"
        transform="translate(1,1)"/>
</svg>
