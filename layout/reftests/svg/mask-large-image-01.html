<html class="reftest-wait">
<title>Luminance mask over an image large enough for WebRender to draw natively</title>
<body style="margin: 0">
<svg width="700" height="500">
  <mask id="m">
    <rect width="300" height="500" fill="white"/>
  </mask>
  <g mask="url(#m)">
    <image id="img" width="600" height="400"/>
  </g>
</svg>
<script>
  const canvas = document.createElement("canvas");
  canvas.width = 600;
  canvas.height = 400;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "lime";
  ctx.fillRect(0, 0, 600, 400);
  ctx.fillStyle = "blue";
  ctx.fillRect(50, 50, 500, 300);
  const img = document.getElementById("img");
  img.addEventListener("load", () => {
    document.documentElement.classList.remove("reftest-wait");
  }, { once: true });
  img.setAttribute("href", canvas.toDataURL());
</script>
</body>
</html>
