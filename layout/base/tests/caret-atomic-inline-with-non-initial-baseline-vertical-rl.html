<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>Bug 2076437: Caret after a `text-top` image in `vertical-rl` follows the writing mode's default baseline</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<style>
  @font-face {
    font-family: Ahem;
    src: url("Ahem.ttf");
  }
  div {
    font: 20px/40px Ahem;
    writing-mode: vertical-rl;
    padding: 0 20px;
    height: 200px;
    outline: none;
  }
  img {
    vertical-align: text-top;
    inline-size: 0;
    block-size: 0.5em;
  }
</style>
<div contenteditable="true" spellcheck="false">abc<img></div>
<script>
SimpleTest.waitForFocus(async function() {
  await document.fonts.ready;
  const div = document.querySelector("div");
  div.focus();
  getSelection().collapse(div, div.childNodes.length);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      document.documentElement.removeAttribute("class");
    });
  });
});
</script>
