plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
    alias(libs.plugins.kotlin.serialization)
}

android {
    namespace = 'mozilla.components.support.remotesettings'
}

dependencies {
    implementation project(':components:support-appservices')
    implementation project(':components:support-base')
    implementation project(':components:support-ktx')
    implementation project(':components:support-utils')

    implementation ComponentsDependencies.mozilla_appservices_errorsupport
    implementation ComponentsDependencies.mozilla_remote_settings
    implementation libs.androidx.work.runtime
    implementation libs.kotlinx.serialization.json

    testImplementation project(':components:support-test')

    testImplementation ComponentsDependencies.mozilla_remote_settings
    testImplementation ComponentsDependencies.mozilla_appservices_full_megazord_libsForTests
    testImplementation ComponentsDependencies.mozilla_appservices_init_rust_components
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.junit
    testImplementation libs.androidx.work.testing
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockito
    testImplementation libs.robolectric
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)
