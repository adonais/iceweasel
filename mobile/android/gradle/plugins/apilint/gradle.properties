# The configuration cache is deliberately disabled. With it enabled, Spotless intermittently fails to
# load formatter classes on multi-project builds invoked together with `clean`, which describes this
# build: https://github.com/diffplug/spotless/issues/2850
org.gradle.configuration-cache=false
