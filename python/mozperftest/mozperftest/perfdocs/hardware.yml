---
# Hardware definitions, and the taskcluster worker pools that are made of
# them. It is used to build the "Platforms and Hardware Used" section of the
# performance infrastructure page, and to link the platforms listed in the
# test documentation to it.
#
# The mapping is keyed on the `<provisioner>/<worker type>` pool rather than
# on the platform label because a platform label does not determine the
# machine on its own: `windows11-64-25h2/opt` runs Talos xperf on Azure
# virtual machines and browsertime on the Windows 11 hardware, and
# `linux2404-64/opt` runs the memory tests in a container and Talos on the
# Moonshots. The platform labels of each pool are gathered from the task
# graph, so they don't need to be listed here.
#
# Every pool that runs a documented test must be listed under the hardware it
# is made of, otherwise `./mach perfdocs` fails. When a new pool starts
# running performance tests, add it here.

hardware:
  hpe-moonshot:
    name: HPE Moonshot
    group: Desktop
    reference: https://mana.mozilla.org/wiki/display/ROPS/HPE+Moonshot
    description: >-
      The HPE Moonshot System supports up to 45 servers in a single chassis,
      where each server resides on a cartridge. The `netperf` pools are the
      subset of them that is set up for the network bandwidth tests.
    location: MDC1
    machines: 45 cartridges per 4.3U chassis
    worker-pools:
      - releng-hardware/gecko-t-linux-talos-2404
      - releng-hardware/gecko-t-linux-netperf-2404
    specifications:
      Model: m710x ProLiant cartridge
      Processor: Intel E3-1585L v5 3.0GHz (4 cores)
      Memory: 8GB DDR4 2400MHz
      Disk: 256GB PCIe M.2 2280 SSD, and 64GB SATA M.2 2242 SSD
      GPU: Intel Iris Pro Graphics P580
      Power: 1500W Hot Plug redundant (1+1) power supply

  mac-mini-r8:
    name: Apple Mac Mini R8
    group: Desktop
    reference: https://mana.mozilla.org/wiki/display/ROPS/Apple+Mac+Mini+R8
    description: >-
      Intel based Mac Minis. All of them have EDID devices attached that set
      the resolution.
    location: MDC1
    worker-pools:
      - releng-hardware/gecko-t-osx-1400-r8
      - releng-hardware/gecko-t-osx-1015-r8
    specifications:
      Model Name: Mac Mini
      Model Identifier: Macmini8,1
      Processor Name: 6-Core Intel Core i7 (i7-8700B)
      Processor Speed: 3.2 GHz
      Number of Processors: 1
      Total Number of Cores: 6
      L2 Cache (per Core): 256 KB
      L3 Cache: 12 MB
      Memory: 16 GB
      Disk: SSD 251 GB (251,000,193,024 bytes)

  mac-mini-m4:
    name: Apple Silicon (M4)
    group: Desktop
    description: >-
      Apple Silicon Mac Minis running macOS 15. They also host the Android
      arm64 emulator tests.
    worker-pools:
      - releng-hardware/gecko-t-osx-1500-m4
    specifications:
      Model Name: Mac mini
      Model Identifier: Mac16,10
      Model Number: MU9D3LL/A
      Processor Name: Apple M4
      Processor Speed: 4.46 GHz
      Number of Processors: 1
      Total Number of Cores: 10 (4 performance and 6 efficiency)
      GPU: 10 Core
      L2 Cache (per performance Core): 16 MB
      L2 Cache (per efficiency Core): 4 MB
      L3 Cache: None (Uses System Level Cache)
      Memory: 16 GB
      Disk: SSD 256 GB

  nuc12-windows11-reference:
    name: Windows 11 Reference
    group: Desktop
    description: >-
      Low-end reference hardware used to catch regressions that are only
      visible on slower machines.
    location: MDC1
    machines: 15 machines
    worker-pools:
      - releng-hardware/win11-64-24h2-hw-ref
    specifications:
      Model Name: NUC12WSKi3
      Processor Name: Intel Core i3-1220P
      Processor Speed: 2.96 GHz
      Number of Processors: 12
      Total Number of Cores: 10
      GPU: Intel UHD Graphics for 12th Gen Intel Processors
      Memory: 8GB
      Disk: 500GB SSD
      Resolution: 1920 x 1080

  nuc13-windows11:
    name: Windows 11
    group: Desktop
    location: MDC1
    machines: 160 machines
    worker-pools:
      - releng-hardware/win11-64-24h2-hw
    specifications:
      Model Name: NUC13ANHi5
      Processor Name: 13th Gen Intel Core i5-1340P
      Processor Speed: 1.9/4.6 GHz
      Number of Processors: 16
      Total Number of Cores: 12
      GPU: Intel Iris Xe Adapter
      Memory: 8GB
      Disk: 500GB SSD
      Resolution: 1920 x 1080

  samsung-a55:
    name: Samsung A55
    group: Mobile
    description: >-
      The devices are split across two device farms: a subset of the
      performance tests, as well as the unit tests, run on the LambdaTest
      devices, and the rest run on the Bitbar ones.
    location: Bitbar, and LambdaTest
    machines: 67 devices total
    worker-pools:
      - proj-autophone/gecko-t-bitbar-gw-perf-a55
      - proj-autophone/gecko-t-lambda-perf-a55
    specifications:
      Model Name: Samsung A55
      Model Identifier: SM_A556E (International)
      Processor Name: Exynos 1480
      Processor Speed: Octa-core (4x2.75GHz ARM Cortex-A78 and 4x2GHz ARM Cortex-A55)
      Number of Processors: 2
      Total Number of Cores: 8
      GPU: Samsung Xclipse 530
      Memory: 8GB
      Disk: 128 | 256 GB
      More Info: https://www.phonemore.com/specs/samsung/galaxy-a55/

  samsung-s24:
    name: Samsung Galaxy S24
    group: Mobile
    location: Bitbar
    machines: 4 devices total
    worker-pools:
      - proj-autophone/gecko-t-bitbar-gw-perf-s24
      - proj-autophone/gecko-t-bitbar-gw-unit-s24
    specifications:
      Model Name: Samsung Galaxy S24
      Model Identifier: SM_S921B (International)
      Processor Name: Exynos 2400
      Processor Speed: >-
        Deca-core (1x3.21GHz ARM Cortex-X4, 2x2.9GHz ARM Cortex-A720,
        3x2.59GHz ARM Cortex-A720 and 4x1.96GHz ARM Cortex-A520)
      Number of Processors: 4
      Total Number of Cores: 10
      GPU: Samsung Xclipse 940
      Memory: 8 GB
      Disk: 128 | 256 GB
      More Info: https://www.phonemore.com/specs/samsung/galaxy-s24/sm-s921bds-128gb/

  google-pixel-6:
    name: Google Pixel 6
    group: Mobile
    location: Bitbar
    machines: 4 devices total
    worker-pools:
      - proj-autophone/gecko-t-bitbar-gw-perf-p6
      - proj-autophone/gecko-t-bitbar-gw-unit-p6
    specifications:
      Model Name: Google Pixel 6
      Model Identifier: Pixel 6
      Processor Name: Google Tensor
      Processor Speed: Octa-core (2x2.80 GHz Cortex-X1, 2x2.25 GHz Cortex-A76 and 4x1.80 GHz Cortex-A55)
      Number of Processors: 1
      Total Number of Cores: 8
      GPU: Mali-G78 MP20
      Memory: 8 GB
      Disk: 128 | 256 GB
      More Info: https://www.phonemore.com/specs/google/pixel-6/

  gcp-c3d-standard-8:
    name: GCP c3d-standard-8
    group: Virtual machines
    description: >-
      Google Cloud virtual machines running the tests in a docker container.
      They are only used by the memory tests, which are not sensitive enough
      to the noise introduced by the hypervisor to require bare metal.
    worker-pools:
      - gecko-t/t-linux-docker-noscratch-amd
    specifications:
      Instance Type: c3d-standard-8
      Processor Name: AMD EPYC (Genoa)
      Total Number of Cores: 8 vCPUs
      Memory: 32 GB
      Image: ubuntu-2404-headless

  azure-standard-f8alds-v7:
    name: Azure Standard_F8alds_v7
    group: Virtual machines
    description: >-
      Azure virtual machines. As with the Linux virtual machines above, they
      are only used by the tests that do not need bare metal: the memory tests
      and the Talos xperf test, which needs the privileged pool to record ETW
      traces.
    worker-pools:
      - gecko-t/win11-64-25h2
      - gecko-t/win11-64-25h2-privileged
    specifications:
      Instance Type: Standard_F8alds_v7
      Processor Name: AMD EPYC
      Total Number of Cores: 8 vCPUs
      Memory: 16 GB
