[DEFAULT]
# security/sandbox is not built on Linux asan/tsan, nor in ccov builds, so there
# is no sandbox for these tests to exercise there. See bug 1784517.
run-if = [
  "os == 'linux' && !asan && !tsan && !ccov",
]
tags = "contentsandbox"
support-files = [
  "browser_content_sandbox_utils.js",
  "browser_content_sandbox_fs_tests.js",
]
test-directories = "/tmp/.snap_firefox_current_real/"
environment = "SNAP=/tmp/.snap_firefox_current_real/"

["browser_content_sandbox_fs_snap.js"]
