[DEFAULT]
# security/sandbox is not built on Linux asan/tsan, nor in ccov builds, so there
# is no sandbox for these tests to exercise there. See bug 1784517.
run-if = [
  "os == 'linux' && !asan && !tsan && !ccov",
]
tags = "contentsandbox"
environment = "XDG_CONFIG_DIRS=:/opt"

["browser_content_sandbox_bug1717599_XDG-CONFIG-DIRS.js"]
