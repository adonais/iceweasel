<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MathML a element referrerpolicy test</title>
</head>

<body>
    <math>
        <a id="mathml-a-noreferrer" href="https://example.com/dummy" referrerpolicy="no-referrer">
            <mtext>MathML Anchor No Referrer</mtext>
        </a>

        <a id="mathml-a-unsafe-url" href="https://example.com/dummy" referrerpolicy="unsafe-url">
            <mtext>MathML Anchor Unsafe URL</mtext>
        </a>
    </math>
</body>

</html>
