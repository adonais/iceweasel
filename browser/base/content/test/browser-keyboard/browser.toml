[DEFAULT]
support-files = ["head.js"]
prefs = [
  "sidebar.revamp=false",
  # Keep browser_gfxDebugShortcuts.js deterministic in builds configured with
  # --enable-webrender-debugger, which enable captures by default.
  "gfx.webrender.debug.enable-capture=false",
]

["browser_bookmarks_shortcut.js"]
https_first_disabled = true

["browser_cancel_caret_browsing_in_content.js"]
support-files = ["file_empty.html"]

["browser_gfxDebugShortcuts.js"]

["browser_popup_keyNav.js"]
https_first_disabled = true
support-files = ["focusableContent.html"]

["browser_search_tabs_shortcut.js"]

["browser_toolbarButtonKeyPress.js"]
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland' && debug", # Bug 1775712
]

["browser_toolbarKeyNav.js"]
support-files = ["!/browser/base/content/test/browser-permissions/permissions.html"]
skip-if = [
  "os == 'win' && os_version == '11.26200' && asan", # Bug 2019745
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && asan && swgl", # Bug 1775713
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && debug", # Bug 1775713
  "os == 'linux' && os_version == '24.04' && arch == 'x86_64' && display == 'x11' && tsan && swgl", # Bug 1775713
]
