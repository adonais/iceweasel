<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Form Autofill Passport Demo Page (Split Name)</title>
</head>
<body>
  <h1>Form Autofill Passport Demo Page (Split Name)</h1>
  <form id="form">
    <p><label>given name: <input type="text" id="passport-given-name" name="passport-given-name" /></label></p>
    <p><label>middle name: <input type="text" id="passport-additional-name" name="passport-additional-name" /></label></p>
    <p><label>family name: <input type="text" id="passport-family-name" name="passport-family-name" /></label></p>
    <p><label>country: <input type="text" id="passport-country" name="passport-country" /></label></p>
    <p><label>number: <input type="text" id="passport-number" name="passport-number" /></label></p>
    <p><label>issue month: <input type="text" id="passport-issue-date-month" name="passport-issue-date-month" /></label></p>
    <p><label>issue day: <input type="text" id="passport-issue-date-day" name="passport-issue-date-day" /></label></p>
    <p><label>issue year: <input type="text" id="passport-issue-date-year" name="passport-issue-date-year" /></label></p>
    <p><label>expiry month: <input type="text" id="passport-expiry-date-month" name="passport-expiry-date-month" /></label></p>
    <p><label>expiry day: <input type="text" id="passport-expiry-date-day" name="passport-expiry-date-day" /></label></p>
    <p><label>expiry year: <input type="text" id="passport-expiry-date-year" name="passport-expiry-date-year" /></label></p>
    <p>
      <input type="submit"/>
      <button type="reset">Reset</button>
    </p>
  </form>
</body>
</html>
