<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Form Fill Supported Fields Test</title>
</head>
<body>
  <form>
    <label for="text">Full name</label>
    <input id="text" name="text" type="text">

    <label for="search">Search</label>
    <input id="search" name="search" type="search">

    <label for="number">Number</label>
    <input id="number" name="number" type="number">

    <label for="month">Month</label>
    <input id="month" name="month" type="month">

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes"></textarea>

    <label for="password">Password</label>
    <input id="password" name="password" type="password">

    <label for="checkbox">Remember me</label>
    <input id="checkbox" name="checkbox" type="checkbox">

    <label for="date">Date</label>
    <input id="date" name="date" type="date">

    <label for="country">Country</label>
    <select id="country" name="country">
      <option>Canada</option>
      <option>United States</option>
    </select>

    <label for="city">City</label>
    <div role="combobox" aria-haspopup="listbox" aria-expanded="false">
      <input id="city" name="city" type="text" aria-autocomplete="list">
    </div>

    <label for="address">Address</label>
    <input id="address" name="address" type="text" role="combobox"
           aria-autocomplete="list" aria-expanded="false">

    <label for="location-filter">Location</label>
    <input id="location-filter" type="text" role="combobox"
           aria-autocomplete="list" aria-expanded="false">
  </form>
</body>
</html>
