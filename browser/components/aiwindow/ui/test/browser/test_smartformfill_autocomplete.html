<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Form Fill test form</title>
  </head>
  <body>
    <form>
      <label>
        Email
        <input id="email" name="email" type="email" />
      </label>
      <label>
        Name
        <input id="name" name="name" type="text" list="names" />
      </label>
      <datalist id="names">
        <option value="Test Name"></option>
      </datalist>
      <label>
        Password
        <input id="password" name="password" type="password" />
      </label>
    </form>
  </body>
</html>
