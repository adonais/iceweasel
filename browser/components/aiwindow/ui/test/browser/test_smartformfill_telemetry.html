<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Form Fill telemetry test form</title>
  </head>
  <body>
    <form id="contact">
      <label>
        Email
        <input id="email" name="email" type="email" />
      </label>
      <label>
        Phone
        <input id="phone" name="phone" type="tel" />
      </label>
    </form>

    <form id="details">
      <label>
        Why are you interested?
        <textarea id="reason" name="reason"></textarea>
      </label>
    </form>
  </body>
</html>
