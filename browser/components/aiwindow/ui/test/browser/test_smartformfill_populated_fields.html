<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Form Fill Populated Fields Test</title>
</head>
<body>
  <form>
    <label for="populated-name">Name</label>
    <input
      id="populated-name"
      name="populatedName"
      autocomplete="name"
      value="Sensitive Existing Value"
    >

    <label for="empty-email">Email</label>
    <input
      id="empty-email"
      name="emptyEmail"
      type="email"
      autocomplete="email"
    >
  </form>
</body>
</html>
