<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mini window crop target</title>
  <style>
    body {
      margin: 0;
    }
    #crop-target {
      position: absolute;
      left: 100px;
      top: 60px;
      width: 300px;
      height: 200px;
      background: rebeccapurple;
      color: white;
      border: 2px solid black;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <p>Crop the purple box exactly: left 100, top 60, 300 x 200.</p>
  <div id="crop-target">crop me</div>
</body>
</html>
