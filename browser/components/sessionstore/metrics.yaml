# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: Session Restore'

session_restore:
  backup_can_be_loaded_session_file:
    type: event
    description: >
      Recorded once for each session file we attempt to load at startup, whether or not the attempt succeeded, including files that don't exist.
      Session Restore tries a series of candidate files in priority order and stops at the first that loads. A startup usually records one event per file tried.
      If none of the compressed files load, it tries the whole list again using legacy uncompressed extensions, so a startup that loads nothing
      records two events per candidate file.

      Use can_load to tell success from failure, and loadfail_reason to tell a missing file from an unreadable or incompatible one.
      Before Firefox 157, every file that existed recorded a secondary event with loadfail_reason "N/A".
      See https://bugzilla.mozilla.org/show_bug.cgi?id=2071466#c2 for details about recovering pre-157 data.

      This event was generated to correspond to the Legacy Telemetry event
      session_restore.backup_can_be_loaded#session_file.
    bugs:
      - https://bugzil.la/1874742
    data_reviews:
      - https://bugzil.la/1874742
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    extra_keys:
      can_load:
        description: >
          Whether or not the startup file can be read/loaded. Missing files and files with an incompatible format
          version are also recorded as "false"
        type: string
      path_key:
        description: >
          A symbolic name for the backup file, should be one of "clean", "recovery", "recoveryBackup", "cleanBackup", or "upgradeBackup"
        type: string
      loadfail_reason:
        description: >
          Why the file could not be loaded, or "N/A" when it loaded. This is free-form rather than a closed set - values interpolate exception names and format-version values, so expect high cardinality.
        type: string
    telemetry_mirror: Session_restore_BackupCanBeLoaded_SessionFile

  startup_session_availability:
    type: event
    description: >
      Recorded once per startup when the session file read completes, including
      when nothing could be restored. Reports what we saw of each candidate
      session file while looking for one to load, and whether the user wanted a
      session restored, so that a session lost to missing files can be told
      apart from a user who starts fresh by choice.
      The per-file keys describe the search, not the profile directory: the
      load order stops at the first file that loads, so files later in the
      order are reported as "not_examined". They are only complete when nothing
      could be loaded, which is the case this event exists to measure, and must
      not be used to estimate how often an individual backup file exists.
      "present" means the read did not report the file as missing, so an
      unusual I/O error counts as present.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=780014
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=780014
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    extra_keys:
      origin:
        description: >
          Which file the session was loaded from, one of "clean", "recovery",
          "recoveryBackup", "cleanBackup" or "upgradeBackup", or "empty" if no
          session could be loaded
        type: string
      format:
        description: >
          The format the session was loaded from, "jsonlz4" or the legacy "js",
          or "none" if no session could be loaded
        type: string
      clean:
        description: >
          What we saw of the clean session file, one of "present", "absent" or
          "not_examined"
        type: string
      recovery:
        description: >
          What we saw of the recovery file, one of "present", "absent" or
          "not_examined"
        type: string
      recovery_backup:
        description: >
          What we saw of the recovery backup file, one of "present", "absent"
          or "not_examined"
        type: string
      clean_backup:
        description: >
          What we saw of the clean backup file, one of "present", "absent" or
          "not_examined"
        type: string
      upgrade_backup:
        description: >
          What we saw of the upgrade backup file, one of "present", "absent",
          "not_examined", or "not_configured" if no upgrade backup was ever
          taken
        type: string
      startup_page_is_resume:
        description: >
          Whether browser.startup.page is set to resume the previous session
        type: boolean
      resume_session_once:
        description: >
          Whether a one-off session resume was pending, as set for restarts due
          to application update, as it was found at startup
        type: boolean
      resume_from_crash:
        description: >
          Whether browser.sessionstore.resume_from_crash allows a crash to lead
          to a restore
        type: boolean
      restarted_by_os:
        description: >
          Whether the OS started the browser, rather than the user
        type: boolean
      resuming_after_os_restart:
        description: >
          Whether a session resume was armed for an OS-initiated restart, as it
          was found at startup
        type: boolean

  startup_session_decision:
    type: event
    description: >
      Recorded once per startup, when Session Restore has decided what to do
      with the session it found. Reports the decision and the reasoning behind
      it, so that a session the user never asked for can be told apart from one
      we chose not to restore.
      This describes the decision only, not whether the restore that followed
      succeeded. No event is recorded if the browser exits before the first
      browser window has finished its delayed startup.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1042341
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1042341
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    extra_keys:
      session_type:
        description: >
          What Session Restore decided to do, one of "no_session", "recover"
          (restore after a crash), "resume" (restore because it was asked for)
          or "defer" (keep the session for the user to restore by hand)
        type: string
      resume_reason:
        description: >
          Why a session was resumed, set when session_type is "resume". One of
          "os_restart" (armed before the OS restarted us), "resume_session_once"
          (a one-off resume, as set for restarts due to application update) or
          "startup_page" (the user asks for their session every time). Where
          more than one applies, the most specific is reported.
        type: string
      previous_session_crashed:
        description: >
          Whether the previous session ended in a crash. Unset when we never
          got as far as checking, which is the case when no session was found
          and in permanent private browsing.
        type: boolean
      action:
        description: >
          What we did with the session state as a result, one of "restore",
          "interstitial" (replaced it with about:sessionrestore), "welcomeback"
          (replaced about:welcomeback with about:sessionrestore), "pinned_only"
          (a deferred session whose pinned tabs were opened), "deferred_only"
          (a deferred session with no pinned tabs, so nothing was opened, but
          its tabs are available in recently-closed and its groups in saved
          groups) or "nothing"
        type: string
      interstitial_reason:
        description: >
          Why about:sessionrestore was shown rather than restoring, set when
          action is "interstitial". One of "old_session", "many_crashes",
          "many_crashes_old_session" or "safe_mode".
        type: string
      init_error:
        description: >
          The name of the error thrown while preparing the session, if one was.
          The session is left in whatever state it had reached.
        type: string
      permanent_private:
        description: >
          Whether this is an auto-started permanent private browsing session,
          in which no session is ever restored
        type: boolean

  shutdown_success_session_startup:
    type: event
    description: >
      Recorded once at startup, reporting whether the previous session shut down cleanly.
      Note that the shutdown_ok extra is inverted relative to its name; see its description.
      Not recorded at all when no valid session was found at startup, so this event's population
      excludes profiles with missing or corrupt session files.

      Profiles in permanent private browsing are not represented in this metric.

      This event was generated to correspond to the Legacy Telemetry event
      session_restore.shutdown_success#session_startup.
    bugs:
      - https://bugzil.la/1874742
    data_reviews:
      - https://bugzil.la/1874742
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    extra_keys:
      shutdown_ok:
        description: >
          Despite the name, this is "true" when the previous session did NOT shut down cleanly - it
          is set from the internal crash flag. The polarity has been inverted since the event was
          introduced and is documented rather than corrected so existing data stays comparable.
          session_restore.shutdown_ok carries the same signal with the expected polarity.
        type: string
      shutdown_reason:
        description: >
          Why we concluded the previous session did not shut down cleanly.

          "final-state-write-incomplete" means the CrashMonitor checkpoints showed we never
          finished writing the final state.

          "session-state-missing-or-running-at-last-write" means we fell back to the session.state
          flag in the session file, which was either absent or still "running".

          "N/A" means we concluded the shutdown was clean, either from the CrashMonitor
          checkpoints, or - if there were no checkpoints - from the session.state flag being
          present and not "running".
        type: string
    telemetry_mirror: Session_restore_ShutdownSuccess_SessionStartup

  shutdown_flush_all_outcomes:
    type: labeled_counter
    description: >
      Counts occurrences of each condition that can end the wait for session data
      to be flushed during an async shutdown.

      These are occurrence counts, not a partition of shutdowns: "complete" is incremented
      when the flush finishes regardless of whether it won the race, and the crash observers
      fire once per content process, so a single shutdown can contribute to more than one
      label and "abnormal_content_shutdown" can exceed the number of shutdowns.

      Use session_restore.shutdown_type's "async" label as the denominator for per-shutdown rates.
    labels:
      - "timed_out"
      - "abnormal_content_shutdown"
      - "oop_frameloader_crashed"
      - "complete"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1903112
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1903112
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never

  shutdown_type:
    type: labeled_counter
    description: >
      On quit-application-granted, is the shutdown sync (immediate) or async
    labels:
      - "sync"
      - "async"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1903112
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1903112
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never

  startup_init_session:
    type: timing_distribution
    description: >
      Session restore: Time it takes to prepare the data structures for
      restoring a session (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_STARTUP_INIT_SESSION_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_STARTUP_INIT_SESSION_MS

  startup_onload_initial_window:
    type: timing_distribution
    description: >
      Session restore: Time it takes to finish restoration once we have first
      opened a window (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_STARTUP_ONLOAD_INITIAL_WINDOW_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_STARTUP_ONLOAD_INITIAL_WINDOW_MS

  collect_all_windows_data:
    type: timing_distribution
    description: >
      Session restore: Time to collect all window data (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_COLLECT_ALL_WINDOWS_DATA_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_COLLECT_ALL_WINDOWS_DATA_MS

  collect_data:
    type: timing_distribution
    description: >
      Session restore: Time to collect all window and tab data (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_COLLECT_DATA_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_COLLECT_DATA_MS

  collect_session_history:
    type: timing_distribution
    description: >
      Session restore: Duration of session history collection in the parent
      process (ms).
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1810704
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1810704
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
      - farre@mozilla.com
    expires: never

  read_file:
    type: timing_distribution
    description: >
      Session restore: Time to read the session data from the file on disk (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_READ_FILE_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_READ_FILE_MS

  write_file:
    type: timing_distribution
    description: >
      Session restore: Time to write the session data to the file on disk (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_WRITE_FILE_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_WRITE_FILE_MS

  file_size_bytes:
    type: memory_distribution
    description: >
      Session restore: The size in bytes of the session file we just
      wrote - recovery.jsonlz4 for writes during the session,
      sessionstore.jsonlz4 for the final write at shutdown.

      Only recorded when the write succeeds, so failed writes are absent rather than counted.

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_FILE_SIZE_BYTES.
    memory_unit: byte
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_FILE_SIZE_BYTES

  corrupt_file:
    type: labeled_counter
    description: >
      Session restore: counts session files that existed at startup,
      labelled by whether the file was recognised as corrupt.
      Recorded once per candidate file in the load order, so one startup can
      contribute several samples.

      "false" means the file existed and was not recognised as corrupt, which
      also includes files rejected for an incompatible format version and files
      that failed to read for reasons we do not specifically handle - it is not
      a count of successful loads.

      Before Firefox 157 a successful load incremented "false" twice, so corruption
      rates computed across that boundary show a step of roughly 2x - this is a correction,
      not a regression.
      Before Firefox 158 errors that Session Restore does not
      specifically handle, and files with an incompatible format
      version, incremented "false" rather than "true".

      Profiles in permanent private browsing are not represented in this metric.

      This metric was generated to correspond to the Legacy Telemetry boolean
      histogram FX_SESSION_RESTORE_CORRUPT_FILE.
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2071442
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072737
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2071442
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2072737
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: h#FX_SESSION_RESTORE_CORRUPT_FILE

  all_files_corrupt:
    type: labeled_counter
    description: >
      Session restore: Whether at least one candidate session file existed
      at startup but none of them could be loaded, across both the
      lz4-compressed files and the legacy uncompressed .js/.bak files.
      Recorded once per startup. "false" also covers profiles with no
      session files at all.

      Before Firefox 159 only the lz4-compressed files counted as existing,
      so a profile whose only files were unloadable legacy ones recorded
      "false".

      Profiles in permanent private browsing are not represented in this metric.

      This metric was generated to correspond to the Legacy Telemetry boolean
      histogram FX_SESSION_RESTORE_ALL_FILES_CORRUPT.
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: h#FX_SESSION_RESTORE_ALL_FILES_CORRUPT

  restore_window:
    type: timing_distribution
    description: >
      Session restore: Time spent blocking the main thread while restoring a
      window state (ms)

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_RESTORE_WINDOW_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1489524
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_RESTORE_WINDOW_MS

  auto_restore_duration_until_eager_tabs_restored:
    type: timing_distribution
    description: >
      Session restore: If the browser is setup to auto-restore tabs, this probe
      measures the time elapsed between the instant we start Session Restore and
      the instant we have finished restoring tabs eagerly. At this stage, the
      tabs that are restored on demand are not restored yet.

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram
      FX_SESSION_RESTORE_AUTO_RESTORE_DURATION_UNTIL_EAGER_TABS_RESTORED_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_AUTO_RESTORE_DURATION_UNTIL_EAGER_TABS_RESTORED_MS

  manual_restore_duration_until_eager_tabs_restored:
    type: timing_distribution
    description: >
      Session restore: If a session is restored by the user clicking on 'Restore
      Session', this probe measures the time elapsed between the instant the
      user has clicked and the instant we have finished restoring tabs eagerly.
      At this stage, the tabs that are restored on demand are not restored yet.

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram
      FX_SESSION_RESTORE_MANUAL_RESTORE_DURATION_UNTIL_EAGER_TABS_RESTORED_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_MANUAL_RESTORE_DURATION_UNTIL_EAGER_TABS_RESTORED_MS

  number_of_tabs_restored:
    type: custom_distribution
    description: >
      Session restore: Number of tabs in the session that has just been
      restored.

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FX_SESSION_RESTORE_NUMBER_OF_TABS_RESTORED.
    range_min: 1
    range_max: 500
    bucket_count: 20
    histogram_type: exponential
    unit: tabs
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_NUMBER_OF_TABS_RESTORED

  number_of_windows_restored:
    type: custom_distribution
    description: >
      Session restore: Number of windows in the session that has just been
      restored.

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram FX_SESSION_RESTORE_NUMBER_OF_WINDOWS_RESTORED.
    range_min: 0
    range_max: 50
    bucket_count: 51
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_NUMBER_OF_WINDOWS_RESTORED

  number_of_eager_tabs_restored:
    type: custom_distribution
    description: >
      Session restore: Number of tabs restored eagerly in the session that has
      just been restored.

      This metric was generated to correspond to the Legacy Telemetry enumerated
      histogram FX_SESSION_RESTORE_NUMBER_OF_EAGER_TABS_RESTORED.
    range_min: 0
    range_max: 50
    bucket_count: 51
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1944631
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    telemetry_mirror: FX_SESSION_RESTORE_NUMBER_OF_EAGER_TABS_RESTORED

  shutdown_ok:
    type: labeled_counter
    description: >
      Did the browser start after a successful shutdown

      Not recorded when no valid session was found at startup, so this
      metric's population excludes profiles with missing or corrupt session
      files.

      Profiles in permanent private browsing are not represented in this metric.

      This metric was generated to correspond to the Legacy Telemetry boolean
      histogram SHUTDOWN_OK.
    labels:
      - "false"
      - "true"
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1421688
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1421688
    notification_emails:
      - chutten@mozilla.com
    expires: never
    telemetry_mirror: h#SHUTDOWN_OK

  startup_timeline:
    type: labeled_quantity
    unit: milliseconds since process creation
    lifetime: application
    description: |
      Events on the startup timeline, in millis since process creation.
      Previously carried in Legacy "main" ping `simpleMeasurements`.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1972836
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1972836
    notification_emails:
      - sfoster@mozilla.com
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    data_sensitivity:
      - technical
    labels:
      - sessionRestoreInitialized
      - sessionRestoreRestoring

  new_tab_on_restore_enabled:
    type: boolean
    lifetime: application
    description: >
      Whether the browser.sessionstore.newTabOnRestore pref is enabled.
      Set on startup and updated when the pref changes.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2023459
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2023459
    notification_emails:
      - hsohaney@mozilla.com
    expires: never
    data_sensitivity:
      - interaction

  startup_session_auto_restored:
    type: event
    description: >
      Recorded when an automatic session restore reaches the point
      where the new-tab-on-restore feature is evaluated,
      with new_tab_action describing what happened there.

      This is a new-tab-on-restore metric rather than a general
      session-restore signal: it is not recorded for crash recovery,
      for restores triggered by browser.sessionstore.resume_session_once
      or when no browser window is available at that point. It should not
      be used as a denominator for automatic restores.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2023459
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2023459
    notification_emails:
      - hsohaney@mozilla.com
    expires: never
    extra_keys:
      new_tab_action:
        description: >
          "disabled" if the new-tab-on-restore feature was not enabled,
          "opened" if a new tab was created, "reused" if the
          selected or rightmost tab was already a new tab page,
          "preempted" if a command-line URL took precedence.
        type: string
    data_sensitivity:
      - interaction

  window_features_mismatch_ignored:
    type: event
    # We should have identified all of the problem areas after a few months
    expires: 2027-04-01
    description: >
      Recorded when SessionStore is asked to restore a saved window's state
      into an existing window whose immutable window features doesn't match
      that of the saved window state. A window's chrome is fixed at creation
      time and can't be changed afterwards, so the mismatched parts of the
      saved state are silently not applied - only tabs and other non-chrome
      state still get restored into the existing window.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2070404
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2070404
    notification_emails:
      - session-restore-telemetry-alerts@mozilla.com
    expires: never
    extra_keys:
      entry_point:
        description: >
          Which code path triggered the restore attempt:
          - "set_window_state": SessionRestore.setWindowState()
          - "set_browser_state": SessionRestore.setBrowserState()
          - "automatic_startup": automatic session restore on startup
          - "automatic_with_taskbar_tab": automatic session restore after
            the user opened the first normal window after having only taskbar
            tabs open
          - "deferred_initial_state": deferred restore when opening the first
            normal window after having closed all normal windows
          - "unknown": caller didn't specify
        type: string
      existing_features:
        description: >
          Existing window's features in a comma-separated list. One or more of:
          - popup
          - private
          - taskbartab
          - chromeless-window
          - web-extension-popup-window
        type: string
      requested_features:
        description: >
          Saved state's window features in a comma-separated list. See
          `existing_features` for definitions.
        type: string
    data_sensitivity:
      - interaction

browser.engagement:
  sessionrestore_interstitial:
    type: labeled_counter
    description: >
      Whether we show about:sessionrestore or not. Split by key, which
      indicates why we showed the item or not. Specifically,
      'deferred_restore' means we didn't autorestore and thus didn't show
      the interstitial; 'autorestore' indicates we autorestored without
      showing the interstitial. 'shown_old_session',
      'shown_only_about_welcomeback', 'shown_many_crashes',
      'shown_many_crashes_old_session' all indicate we did show the
      interstitial because of a crash, and the text after 'shown'
      indicates what secondary reason there was to show this page (as we
      don't show it for 'just' one crash). 'shown_safe_mode' also follows a
      crash, but the interstitial is shown because we never automatically
      restore in Safe Mode, whatever the crash count or session age. That
      case was not recorded at all before Firefox 159, so the other 'shown'
      keys undercount by however often it happened.
      This metric was generated to correspond to the Legacy Telemetry
      scalar browser.engagement.sessionrestore_interstitial.
    bugs:
      - https://bugzil.la/1671271
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1042341
    data_reviews:
      - https://bugzil.la/1671271
    notification_emails:
      - gijs@mozilla.com
    expires: never
    telemetry_mirror: BROWSER_ENGAGEMENT_SESSIONRESTORE_INTERSTITIAL
