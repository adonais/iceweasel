schema: 1

bugzilla:
  product: Core
  component: "MFBT"

origin:
  name: double-conversion
  description: binary-decimal and decimal-binary routines for IEEE doubles

  url: https://github.com/google/double-conversion

  release: f501091d5fbfbc1b11bcafb2a86d54733f1bee16 (2026-09-04T22:32:10Z).
  revision: f501091d5fbfbc1b11bcafb2a86d54733f1bee16

  license: BSD-3-Clause
  license-file: LICENSE

vendoring:
  url: https://github.com/google/double-conversion
  source-hosting: github
  tracking: commit

  exclude:
    - "*"
    - "double-conversion/*"
    - cmake
    - msvc
    - test

  include:
    - LICENSE
    - README.md
    - "double-conversion/*.h"
    - "double-conversion/*.cc"

  patches:
    - add-mfbt-api-markers.patch
    - use-mozilla-assertions.patch
    - debug-only-functions.patch
    - to-fixed-dbl-max.patch

  update-actions:
    - action: move-file
      from: '{vendor_dir}/README.md'
      to: '{vendor_dir}/double-conversion/README.md'
    - action: delete-path
      path: '{vendor_dir}/double-conversion/.gitignore'
