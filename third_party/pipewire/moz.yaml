# Version of this schema
schema: 1

bugzilla:
  # Bugzilla product and component for this directory and subdirectories
  product: "Core"
  component: "WebRTC"

origin:
  name: "pipewire"
  description: "PipeWire is a server and user space API to deal with multimedia pipelines"

  url: "https://pipewire.org/"
  license: MIT
  release: 1.6.8 (2026-07-09T12:25:35+02:00).
  revision: 1.6.8
  license-file: COPYING

vendoring:
  url: https://gitlab.freedesktop.org/pipewire/pipewire
  source-hosting: gitlab
  tracking: tag
  vendor-directory: third_party/pipewire/
  skip-vendoring-steps: ['update-moz-build']
  include:
    - 'spa/include/spa/*/*.h'
    - 'spa/include/spa/*/*/*.h'
    - 'src/pipewire/*.h'
    - 'src/pipewire/version.h.in'
    - 'meson.build'
    - 'COPYING'
  exclude:
    - '.*'
    - '*'
    - 'doc'
    - 'include'
    - 'pipewire-alsa'
    - 'pipewire-jack'
    - 'pipewire-v4l2'
    - 'po'
    - 'spa'
    - 'src'
    - 'subprojects'
    - 'test'
  keep:
    - 'libpipewire'
    - 'generate_version.sh'
    - 'README.md'
  update-actions:
    - action: run-script
      script: generate_version.sh
      cwd: .
    - action: delete-path
      path: '{yaml_dir}/src/pipewire/version.h.in'
    - action: delete-path
      path: '{yaml_dir}/meson.build'
    # Move src/pipewire to the root directory
    - action: move-dir
      from: '{yaml_dir}/src/pipewire'
      to: '{yaml_dir}/pipewire'
    - action: delete-path
      path: '{yaml_dir}/src'
    # Move src/spa/include/spa to the root directory
    - action: move-dir
      from: '{yaml_dir}/spa/include/spa'
      to: '{yaml_dir}/spa'
    - action: delete-path
      path: '{yaml_dir}/spa/include'
