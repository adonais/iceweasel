[DEFAULT]
subsuite = "a11y"
support-files = [
  "!/accessible/tests/browser/shared-head.js",
  "head.js",
  "!/accessible/tests/mochitest/*.js",
]
run-if = [
  "!a11y_checks", # these tests start and stop the accessibility service themselves
]
prefs = [
  # Required for the eval in invokeContentTask in shared-head.js
  "security.allow_eval_with_system_principal=true"
]

["browser_test_doc_creation.js"]

["browser_test_urlbar.js"]
