# Step 3 of the pipeline recycling sequence: each frame retires the previous
# iframe pipeline and introduces a new one, with the removal sent as its own
# transaction. See invalidation.list.
---
remove-pipelines:
  - [1, 4]
root:
  items:
    - type: iframe
      bounds: [0, 0, 500, 200]
      id: [1, 5]
pipelines:
  - id: [1, 5]
    items:
      - type: text
        origin: [20, 100]
        text: "Gamma"
        font: "../reftests/text/FreeSans.ttf"
        size: 40
        color: [255, 255, 255, 1]
