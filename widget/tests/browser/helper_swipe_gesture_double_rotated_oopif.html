<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#frame-wrapper {
  position: absolute;
  left: 0;
  top: 0;
  width: 100vh;
  height: 100vw;
  transform: rotate(90deg) translateY(-100%);
  transform-origin: top left;
}

#oopif {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>
<body>
<div id="frame-wrapper">
  <iframe id="oopif"></iframe>
</div>
</body>
</html>
