<html id="one-pixel-client" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Sizes</title>
    <style>
      :root {
        min-width: 200px;
        min-height: 100px;
        max-width: 400px;
        max-height: 300px;
      }
      :root:target {
        min-height: 0;
      }
      :root, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: clip;
      }
      #content {
        width: 400px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="content">Window content</div>
  </body>
</html>
