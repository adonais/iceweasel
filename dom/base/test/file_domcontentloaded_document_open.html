<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<script>
document.addEventListener("DOMContentLoaded", () => {
  // document.open() clears the content while DOMContentLoaded is being fired.
  document.open();
  document.write(
    "<!DOCTYPE html><html><body><script>" +
    "parent.postMessage('reopened', '*');" +
    "<\/script></body></html>");
  document.close();
});
</script>
</head>
<body></body>
</html>
