  "dom.security.permissionsPolicy.header.enabled=true",
  "dom.security.permissionsPolicy.webidl.enabled=true",
  "network.lna.blocking=true",
]
support-files = [
  "empty.html",
  "test_parser.html^headers^",
]

["include:mochitest-xslt.toml"]

["test_featureList.html"]

["test_initial_aboutblank.html"]

["test_nested.html"]
