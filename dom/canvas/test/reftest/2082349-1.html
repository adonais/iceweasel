<!DOCTYPE html>
<head><meta charset="utf-8"></head>
<body>
<canvas id="canvas" width="50" height="50" style="background-color: #ff0000;"></canvas>
<script>
let ctx = canvas.getContext("2d", { get alpha() { canvas.getContext("2d", {alpha: false}); return true; }});
ctx.fillStyle = "rgba(0, 255, 0, 0.5)";
ctx.fillRect(0, 0, 50, 50);
</script>
</body>
