[DEFAULT]
support-files = ["head.js"]
prefs = ["dom.documentpip.enabled=true"]

["browser_move_pip_for_fullscreen.js"]
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland'", # Bug 2057875
]

["browser_parent_has_pip_flag.js"]

["browser_pip_closes_once.js"]

["browser_pip_exits_fs.js"]

["browser_pip_extensions.js"]

["browser_pip_fullscreen_disallowed.js"]

["browser_pip_remembers_position.js"]
tags = "vertical-tabs" # Might collapse tabs toolbar, changing outer size
skip-if = [
  "os == 'linux' && os_version == '22.04' && arch == 'x86_64' && display == 'wayland'", # Bug 2057874
]

["browser_pip_throttling.js"]

["browser_pip_ui.js"]
tags = "vertical-tabs" # Could change visibility of browser UI elements

["browser_return_to_opener.js"]

["browser_sessionstore_ignore_dpip.js"]
