[package]
name = "content_classifier_engine"
version = "0.0.1"
edition = "2021"
authors = ["Tim Huang <tihuang@mozilla.com>", "Benjamin VanderSloot <bvandersloot@mozilla.com>"]
license = "MPL-2.0"

[dependencies]
etp_engine = { path = "../etp_engine", features = ["full-regex-handling", "single-thread", "malloc-size-of"], default-features = false }
cstr = "0.2"
malloc_size_of = { path = "../../../../gfx/wr/wr_malloc_size_of", package = "wr_malloc_size_of", default-features = false }
nsstring = { path = "../../../../xpcom/rust/nsstring" }
nserror = { path = "../../../../xpcom/rust/nserror" }
thin-vec = { version = "0.2.1", features = ["gecko-ffi"] }
xpcom = { path = "../../../../xpcom/rust/xpcom" }
