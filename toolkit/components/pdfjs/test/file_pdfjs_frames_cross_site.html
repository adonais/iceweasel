<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A page with cross-site PDFs in frames it doesn't display</title>
  </head>
  <body>
    <dialog>
      <iframe
        src="https://example.org/browser/toolkit/components/pdfjs/test/file_pdfjs_test.pdf?dialog"
        width="600"
        height="400"
      ></iframe>
    </dialog>
    <div style="display: none">
      <iframe
        src="https://example.org/browser/toolkit/components/pdfjs/test/file_pdfjs_test.pdf?hidden"
        width="600"
        height="400"
      ></iframe>
    </div>
    <iframe
      src="https://example.org/browser/toolkit/components/pdfjs/test/file_pdfjs_test.pdf?shown"
      width="600"
      height="400"
    ></iframe>
  </body>
</html>
