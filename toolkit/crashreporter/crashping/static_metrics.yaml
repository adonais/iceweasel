$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Toolkit :: Crash Reporting'
meta:
  annotations:
    description: The source crash annotations for this ping.
    bugs:
      - https://bugzilla.mozilla.org/2049744
    data_reviews:
      - https://bugzilla.mozilla.org/2049744
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - crash-reporting-wg@mozilla.org
      - stability@mozilla.org
    send_in_pings:
      - crash
    type: object
    structure:
      type: object
      properties:
        source:
          type: string
