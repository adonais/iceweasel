<!doctype html>

<html>
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Network Monitor test page</title>
  </head>

  <body>
    <p>JSON Lines test</p>

    <script type="text/javascript">
      /* exported performRequests */
      "use strict";

      function get(address) {
        return new Promise(resolve => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", address, true);

          xhr.onreadystatechange = function() {
            if (this.readyState == this.DONE) {
              resolve();
            }
          };
          xhr.send(null);
        });
      }

      async function performRequests() {
        // The page query string selects which response the test wants, either a
        // format handled by sjs_content-type-test-server.sjs, or the static
        // jsonl_text_plain.jsonl file.
        const params = new URLSearchParams(window.location.search);
        const file = params.get("file");
        if (file) {
          await get(file);
          return;
        }
        await get("sjs_content-type-test-server.sjs" + window.location.search);
      }
    </script>
  </body>

</html>
