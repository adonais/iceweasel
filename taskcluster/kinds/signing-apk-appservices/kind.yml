---
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.duplicate:transforms

kind-dependencies:
    - signing-apk
    - build-apk
    - build-apk-appservices

tasks:
    appservices-in-tree:
        duplicate:
            kinds:
                - signing-apk
            suffix: -appservices-in-tree
            treeherder-symbol-suffix: -as
            chain-from:
                - build-apk-appservices
            exclude-labels:
                - '-(beta|release|nightly)(-|$)'
        attributes:
            run_on_projects: []
        task:
            extra:
                treeherder:
                    tier: 3
