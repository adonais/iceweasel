---
task-defaults:
    description: "python wheels build"
    attributes:
        local-toolchain: true
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 3600
    run:
        toolchain-extract: false
        script: build-python-wheel.sh
        resources:
            - 'build/wheel_requirements.txt'

linux64-python3.10-dbus-python:
    treeherder:
        symbol: TL(py3.10-dbus-python)
    use-python: "3.10"
    fetches:
        fetch:
            - dbus-python-1.3.2
    run:
        arguments:
            - -Csetup-args=-Ddoc=false
            - -Csetup-args=-Dtests=false
            - -Csetup-args=-Dinstalled_tests=false
        toolchain-artifact: public/build/dbus_python-1.3.2-cp310-cp310-linux_x86_64.whl
    worker:
        docker-image: {in-tree: ubuntu2204-build-python-wheels}

linux-python-dbusmock:
    treeherder:
        symbol: TL(py-python-dbusmock)
    fetches:
        fetch:
            - python-dbusmock-0.32.2
    run:
        toolchain-artifact: public/build/python_dbusmock-0.32.2-py3-none-any.whl
    worker:
        docker-image: {in-tree: ubuntu2404-build-python-wheels}

linux64-python3.10-pygobject:
    treeherder:
        symbol: TL(py3.10-pygobject)
    use-python: "3.10"
    fetches:
        fetch:
            - pygobject-3.48.2
    run:
        toolchain-artifact: public/build/pygobject-3.48.2-cp310-cp310-linux_x86_64.whl
    worker:
        docker-image: {in-tree: ubuntu2204-build-python-wheels}

linux64-python3.10-pycairo:
    treeherder:
        symbol: TL(py3.10-pycairo)
    use-python: "3.10"
    fetches:
        fetch:
            - pycairo-1.29.0
    run:
        toolchain-artifact: public/build/pycairo-1.29.0-cp310-cp310-linux_x86_64.whl
    worker:
        docker-image: {in-tree: ubuntu2204-build-python-wheels}
