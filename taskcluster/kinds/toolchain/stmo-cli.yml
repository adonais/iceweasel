---
task-defaults:
    description: "stmo-cli toolchain build"
    attributes:
        local-toolchain: true
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: build-rust-based-toolchain.sh
        toolchain-artifact: public/build/stmo-cli.tar.zst
    fetches:
        fetch:
            - stmo-cli

linux64-stmo-cli:
    treeherder:
        symbol: TL(stmo-cli)
    run:
        arguments: ['x86_64-unknown-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-toolchain-sysroot

linux64-aarch64-stmo-cli:
    treeherder:
        symbol: TLA64(stmo-cli)
    run:
        arguments: ['aarch64-unknown-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-aarch64-toolchain-sysroot

macosx64-stmo-cli:
    treeherder:
        symbol: TM(stmo-cli)
    run:
        arguments: ['x86_64-apple-darwin']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-macos-toolchain
            - macosx64-sdk-toolchain

macosx64-aarch64-stmo-cli:
    treeherder:
        symbol: TMA64(stmo-cli)
    run:
        arguments: ['aarch64-apple-darwin']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-macos-toolchain
            - macosx64-sdk-toolchain

win64-stmo-cli:
    treeherder:
        symbol: TW64(stmo-cli)
    run:
        arguments: ['x86_64-pc-windows-msvc']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-windows-toolchain
            - vs-toolchain
