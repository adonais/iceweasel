---
task-defaults:
    worker-type: t-linux-docker-amd
    attributes:
        code-review: true
    worker:
        docker-image: {in-tree: static-analysis-build}
        max-run-time: 1200
        artifacts:
            - type: file
              name: public/code-review/issues.json
              path: /builds/worker/issues.json
            - type: file
              name: public/code-review/vcs-diff.diff
              path: /builds/worker/vcs-diff.diff
    treeherder:
        kind: test
        tier: 1
    platform: lint/opt
    run:
        using: run-task

rust:
    description: Rust vendoring validation
    treeherder:
        symbol: rust(vendor)
    worker:
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    run:
        cwd: '{checkout}'
        command: >-
            ./mach vendor rust --issues-json /builds/worker/issues.json --vcs-diff /builds/worker/vcs-diff.diff
    fetches:
        toolchain:
            - linux64-cargo-vet
            - linux64-rust
    when:
        files-changed:
            - 'Cargo.lock'
            - '**/Cargo.toml'
            - 'python/mozbuild/mozbuild/vendor/vendor_rust.py'
            - 'supply-chain/**'
            - 'third_party/rust/**'

node:
    description: Node vendoring validation
    attributes:
        code-review: false
    treeherder:
        symbol: node(vendor)
    worker:
        artifacts: []
        env:
            MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
    run:
        cwd: '{checkout}'
        command: >-
            ./mach vendor node --ignore-modified &&
            ./mach python -c
            'import sys; from mozversioncontrol import get_repository_object;
            changed = [f for f in get_repository_object(".").get_changed_files("ADM", mode="all")
            if f.startswith("third_party/node/")];
            print("\n".join(changed)); sys.exit(1 if changed else 0)'
    fetches:
        toolchain:
            - linux64-node
        fetch:
            - pnpm
    when:
        files-changed:
            - 'third_party/node/**'
            - 'browser/extensions/newtab/package.json'
            - 'python/mozbuild/mozbuild/vendor/vendor_node.py'
            - 'taskcluster/kinds/fetch/pnpm.yml'
