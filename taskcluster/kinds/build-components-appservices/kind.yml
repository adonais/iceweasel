---
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.duplicate:transforms

kind-dependencies:
    - build-components

tasks:
    appservices-in-tree:
        duplicate:
            kinds:
                - build-components
            suffix: -appservices-in-tree
            treeherder-symbol-suffix: -as
            exclude-labels:
                - '-(beta|release|nightly)(-|$)'
        attributes:
            run_on_projects: []
        dependencies:
            build-fat-aar: build-fat-aar-android-geckoview-fat-aar-appservices/opt
            toolchain-linux64-android-gradle-dependencies:
                toolchain-linux64-android-gradle-dependencies-appservices
        task:
            payload:
                env:
                    MOZ_APPSERVICES_IN_TREE: "1"
            extra:
                treeherder:
                    tier: 3
